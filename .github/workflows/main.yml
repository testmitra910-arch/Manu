name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build TEST MITRA APK
    runs-on: ubuntu-latest

    env:
      ZIP_FILE: test-mitra.zip
      GRADLE_VERSION: "9.3.1"

    steps:

      # ============================================
      # 1. Checkout repository
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================
      # 2. Find ZIP file
      # ============================================
      - name: Find ZIP file
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP file..."

          ZIP_PATH=""

          if [ -f "./${ZIP_FILE}" ]; then
            ZIP_PATH="./${ZIP_FILE}"
          else
            ZIP_PATH=$(find . -maxdepth 4 -type f \
              \( -iname "*.zip" \) \
              | head -1 || true)
          fi

          if [ -z "$ZIP_PATH" ]; then
            echo "ERROR: ZIP file not found."
            echo ""
            echo "Repository files:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "ZIP found: $ZIP_PATH"

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"


      # ============================================
      # 3. Extract ZIP
      # ============================================
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf /tmp/testmitra
          mkdir -p /tmp/testmitra

          echo "Extracting ZIP..."

          unzip -q "$ZIP_PATH" -d /tmp/testmitra

          echo ""
          echo "ZIP extracted successfully."
          echo ""
          echo "Extracted files:"

          find /tmp/testmitra -maxdepth 5 -type f \
            | sort \
            | head -300


      # ============================================
      # 4. Locate Android project
      # ============================================
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          SETTINGS_KTS=$(find /tmp/testmitra \
            -type f \
            -name "settings.gradle.kts" \
            | head -1 || true)

          SETTINGS_GRADLE=$(find /tmp/testmitra \
            -type f \
            -name "settings.gradle" \
            | head -1 || true)

          if [ -n "$SETTINGS_KTS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_KTS")

          elif [ -n "$SETTINGS_GRADLE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_GRADLE")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."

            echo ""
            echo "Gradle files found:"
            find /tmp/testmitra -type f \
              \( -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \) \
              -print

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "Android project found:"
          echo "$PROJECT_DIR"
          echo "=========================================="

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Project files:"

          find "$PROJECT_DIR" -maxdepth 4 -type f \
            | sort \
            | head -300


      # ============================================
      # 5. Setup Java 17
      # IMPORTANT:
      # No Gradle cache here because project has
      # no Gradle wrapper.
      # ============================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================
      # 6. Setup Gradle 9.3.1
      # ============================================
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"


      # ============================================
      # 7. Check Java and Gradle
      # ============================================
      - name: Check Java and Gradle
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "JAVA VERSION"
          echo "=========================================="

          java -version

          echo ""
          echo "=========================================="
          echo "GRADLE VERSION"
          echo "=========================================="

          gradle --version


      # ============================================
      # 8. Create local.properties
      # ============================================
      - name: Create local.properties
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "local.properties created."

          cat local.properties


      # ============================================
      # 9. Create Supabase environment
      # ============================================
      - name: Create Supabase environment
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          echo "Creating Supabase environment..."

          cd "$PROJECT_DIR"

          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF

          echo "Supabase environment created."


      # ============================================
      # 10. Add Internet permission
      # ============================================
      - name: Add Internet permission
        shell: bash
        run: |
          set -e

          MANIFEST=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/src/main/AndroidManifest.xml" \
            | head -1 || true)

          if [ -z "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          echo "Manifest:"
          echo "$MANIFEST"

          if grep -q \
            "android.permission.INTERNET" \
            "$MANIFEST"; then

            echo "Internet permission already exists."

          else

            python3 - "$MANIFEST" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          permission = '    <uses-permission android:name="android.permission.INTERNET" />'

          if "android.permission.INTERNET" not in text:
              text = text.replace(
                  "</manifest>",
                  permission + "\n</manifest>"
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Internet permission added.")
          PY

          fi

          echo ""
          echo "AndroidManifest.xml:"
          cat "$MANIFEST"


      # ============================================
      # 11. Show project Gradle configuration
      # ============================================
      - name: Show Gradle configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "settings.gradle files"
          echo "=========================================="

          if [ -f "settings.gradle.kts" ]; then
            cat settings.gradle.kts
          elif [ -f "settings.gradle" ]; then
            cat settings.gradle
          fi

          echo ""
          echo "=========================================="
          echo "Root build.gradle files"
          echo "=========================================="

          if [ -f "build.gradle.kts" ]; then
            cat build.gradle.kts
          fi

          if [ -f "build.gradle" ]; then
            cat build.gradle
          fi


      # ============================================
      # 12. Clean Android project
      # ============================================
      - name: Clean Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Cleaning Android project..."

          gradle clean \
            --no-daemon \
            --stacktrace


      # ============================================
      # 13. Build Debug APK
      # ============================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "BUILDING TEST MITRA APK"
          echo "=========================================="

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --info


      # ============================================
      # 14. Find APK
      # ============================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=""

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*-debug.apk" \
            | head -1 || true)

          if [ -z "$APK" ]; then
            APK=$(find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              | head -1 || true)
          fi

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "APK found:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk/TEST-MITRA.apk"

          echo ""
          echo "APK copied successfully."

          ls -lh \
            "$GITHUB_WORKSPACE/apk/TEST-MITRA.apk"


      # ============================================
      # 15. Upload APK
      # ============================================
      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: apk/TEST-MITRA.apk
          if-no-files-found: error


      # ============================================
      # 16. Build Summary
      # ============================================
      - name: Build Summary
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "       TEST MITRA APK BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "APK: TEST-MITRA.apk"
          echo ""
          echo "Artifact: TEST-MITRA-APK"
          echo ""
          echo "The APK is available in the Actions"
          echo "run under Artifacts."
          echo "=========================================="
