name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build TEST MITRA APK
    runs-on: ubuntu-latest

    env:
      ZIP_FILE: test-mitra.zip
      GRADLE_VERSION: "9.3.1"

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Find ZIP
      # ==========================================
      - name: Find ZIP file
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP..."

          ZIP_PATH=""

          if [ -f "./${ZIP_FILE}" ]; then
            ZIP_PATH="./${ZIP_FILE}"
          else
            ZIP_PATH=$(find . -maxdepth 4 -type f \
              -iname "*.zip" | head -1 || true)
          fi

          if [ -z "$ZIP_PATH" ]; then
            echo "ERROR: ZIP file not found."
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "ZIP found: $ZIP_PATH"

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"


      # ==========================================
      # 3. Extract ZIP
      # ==========================================
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf /tmp/testmitra
          mkdir -p /tmp/testmitra

          unzip -q "$ZIP_PATH" -d /tmp/testmitra

          echo "ZIP extracted successfully."

          find /tmp/testmitra -maxdepth 5 -type f \
            | sort | head -300


      # ==========================================
      # 4. Locate Android project
      # ==========================================
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          SETTINGS_KTS=$(find /tmp/testmitra \
            -type f \
            -name "settings.gradle.kts" \
            | head -1 || true)

          SETTINGS_GRADLE=$(find /tmp/testmitra \
            -type f \
            -name "settings.gradle" \
            | head -1 || true)

          if [ -n "$SETTINGS_KTS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_KTS")

          elif [ -n "$SETTINGS_GRADLE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_GRADLE")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 5. Setup Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 6. Setup Gradle
      # ==========================================
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"


      # ==========================================
      # 7. Create local.properties
      # ==========================================
      - name: Create local.properties
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "local.properties:"
          cat local.properties


      # ==========================================
      # 8. Fix Kotlin Source Sets
      # ==========================================
      - name: Fix Kotlin Source Sets
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          touch gradle.properties

          if grep -q \
            "^android.disallowKotlinSourceSets=" \
            gradle.properties; then

            sed -i \
              's/^android.disallowKotlinSourceSets=.*/android.disallowKotlinSourceSets=false/' \
              gradle.properties

          else

            echo "" >> gradle.properties
            echo "# Allow Kotlin sourceSets used by the project" >> gradle.properties
            echo "android.disallowKotlinSourceSets=false" >> gradle.properties

          fi

          echo ""
          echo "gradle.properties:"
          cat gradle.properties


      # ==========================================
      # 9. Create Supabase environment
      # ==========================================
      - name: Create Supabase environment
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF

          echo "Supabase environment created."


      # ==========================================
      # 10. Add Internet Permission
      # ==========================================
      - name: Add Internet permission
        shell: bash
        run: |
          set -e

          MANIFEST=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/src/main/AndroidManifest.xml" \
            | head -1 || true)

          if [ -z "$MANIFEST" ]; then
            echo "AndroidManifest.xml not found."
            exit 1
          fi

          echo "Manifest: $MANIFEST"

          if grep -q \
            "android.permission.INTERNET" \
            "$MANIFEST"; then

            echo "Internet permission already exists."

          else

            python3 - "$MANIFEST" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          permission = '    <uses-permission android:name="android.permission.INTERNET" />'

          if "android.permission.INTERNET" not in text:
              text = text.replace(
                  "</manifest>",
                  permission + "\n</manifest>"
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Internet permission added.")
          PY

          fi


      # ==========================================
      # 11. Check Java / Gradle
      # ==========================================
      - name: Check Java and Gradle
        shell: bash
        run: |
          set -e

          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version


      # ==========================================
      # 12. Clean
      # ==========================================
      - name: Clean Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Cleaning Android project..."

          gradle clean \
            --no-daemon \
            --stacktrace


      # ==========================================
      # 13. Build APK
      # ==========================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING TEST MITRA APK"
          echo "======================================"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --info


      # ==========================================
      # 14. Find APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*-debug.apk" \
            | head -1 || true)

          if [ -z "$APK" ]; then
            APK=$(find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              | head -1 || true)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: APK not created."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk/TEST-MITRA.apk"

          ls -lh "$GITHUB_WORKSPACE/apk/TEST-MITRA.apk"


      # ==========================================
      # 15. Upload APK
      # ==========================================
      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: apk/TEST-MITRA.apk
          if-no-files-found: error


      # ==========================================
      # 16. Summary
      # ==========================================
      - name: Build Summary
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "   TEST MITRA APK BUILD SUCCESS"
          echo "======================================"
          echo ""
          echo "APK: TEST-MITRA.apk"
          echo "Artifact: TEST-MITRA-APK"
          echo ""
          echo "======================================"
